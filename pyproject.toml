[project]
name = "jurisassist"
version = "0.1.0"
description = "Assistente jurídico local com RAG auditável"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "pgvector>=0.3.6,<1", "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "beautifulsoup4>=4.13,<5",
  "pypdf>=5.3,<7", "langgraph>=1.0,<2", "prometheus-client>=0.21,<1",
  "rank-bm25>=0.2,<1", "snowballstemmer>=3,<4",
]

[project.optional-dependencies]
embeddings = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "huggingface-hub>=0.30,<2"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "locust>=2.33,<3"]

[project.scripts]
jurisassist = "jurisassist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/jurisassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
ignore = ["B008", "S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S311"]
