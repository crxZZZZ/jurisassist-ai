name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: jurisassist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.5", python-version: "3.12", enable-cache: true }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend tests migrations
      - run: uv run pytest --cov=jurisassist --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-password@localhost:5432/jurisassist_test
      - run: uv export --frozen --no-dev --extra embeddings --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
      - run: uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/aws init -backend=false
      - run: terraform -chdir=infra/aws validate
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t jurisassist-ci .
      - run: docker build -t jurisassist-web-ci frontend
